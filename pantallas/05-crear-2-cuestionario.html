<div class="g2" style="grid-template-columns:1.45fr 1fr"><div class="card"><div class="ct" style="font-size:23px">Participación por colectivo</div>${[['Producción',91,1],['Logística',86,.9],['Comercial',84,.85],['Oficinas',72,.5],['Mantenimiento',58,.3],['Turno de noche',49,.18]].map(r=>`<div style="display:grid;grid-template-columns:minmax(110px,190px) 1fr 54px;gap:14px;align-items:center;margin:16px 0"><span style="font-size:17px">${r[0]}</span><div class="bar" style="height:14px"><i style="width:${r[1]}%;background:rgba(210,10,16,${r[2]})"></i></div><span style="text-align:right;font-size:17px">${r[1]} %</span></div>`).join('')}</div>
<div class="card"><div class="ct" style="font-size:23px">Colectivos a priorizar</div>${[['moon','Turno de noche','49 %',1],['wrench','Mantenimiento','58 %'],['laptop','Oficinas','72 %']].map(r=>`<div class="alrow" style="background:${r[3]?'#fdeaea':'#fdf3f3'}"><span class="red">${I(r[0],34,1.5)}</span><div class="t"><b style="font-size:19px">${r[1]}</b></div><b style="color:#c4392f;font-size:19px">${r[2]}</b></div>`).join('')}</div></div>
${rec('Refuerza la comunicación en turno de noche y mantenimiento con un canal directo y un recordatorio personalizado, sin aumentar la frecuencia.',btn('Aplicar recomendaciones','r','zap'))}`;
V.alertas=()=>`${ph('Centro de alertas inteligentes','Detecta temas relevantes, cambios de tendencia y situaciones que requieren atención.',{back:'encuestas',r:sel('Últimos 30 días','pill')})}
<div class="g3">${kv('bell','Alertas activas','5',{s:56,fs:36,mid:'',right:`<span>${dl(1,'+2','pr')}</span>`})}${kv('trend','Tendencias emergentes','3',{s:56,fs:36})}${kv('checkc','Alertas resueltas','2',{s:56,fs:36})}</div>
<div class="g2" style="grid-template-columns:1.1fr 1fr"><div class="card"><div class="ct" style="font-size:25px">Alertas activas</div>${[['warn','Aumento de carga de trabajo','+24 % de menciones en la última semana','Alta','pr','#fdeaea',''],['users','Satisfacción en turnos de noche','Valoración −0,6 puntos respecto al mes anterior','Media','pa','#fff6e3','y'],['wrench','Incidencias en mantenimiento','Mayor número de comentarios negativos','Media','pa','#fff6e3','y']].map(a=>`<div class="alrow" style="background:${a[5]}"><span style="color:${a[6]?'#e8a000':'var(--red)'}">${I(a[0],36,1.5)}</span><div class="t"><b>${a[1]}</b><small>${a[2]}</small></div>${pill(a[3],a[4],'" style="padding:8px 26px;font-size:15px')}${I('cr',20,2.2)}</div>`).join('')}</div>
<div class="card"><div class="ct" style="font-size:25px">Evolución del sentimiento</div>${chart({id:'al',w:560,h:260,pl:52,pt:36,lx:[.05,.35,.65,.95],labels:['Sem 1','Sem 2','Sem 3','Sem 4'],axis:1,min:7,max:9,ticks:[9,8.5,8,7.5,7].map(v=>({v,l:v.toFixed(1).replace('.',',')})),series:[{data:[8.0,8.15,7.75,8.25],area:1,dots:'all',badge:'8,3'}]})}</div></div>
${rec('Analizar la carga de trabajo en Producción y explorar medidas de refuerzo en las próximas semanas.',btn('Ver plan de acción','r','zap','plan'))}`;
document.getElementById('app').innerHTML=`<div class="top"><span class="hL" data-go="home"></span><span class="hM"></span><span class="hR" data-go="alertas"></span></div><div class="shell"><aside class="side">${NAV.filter(n=>KEEP.includes(n[0])).map(n=>`<a data-nav="${n[0]}" data-go="${n[0]}">${I(n[2],26,1.7)}<span>${n[1]}</span></a>`).join('')}</aside><main id="view"></main></div>`;
const view=document.getElementById('view');
const FILES={"home": "02-inicio.html", "encuesta": "01-detalle-encuesta.html", "encuestas": "03-encuestas.html", "crear/1": "04-crear-1-configuracion.html", "crear/2": "05-crear-2-cuestionario.html", "crear/3": "06-crear-3-audiencia.html", "crear/4": "07-crear-4-revision.html", "historial": "08-historial-campanas.html", "soluciones": "09-laboratorio-soluciones.html", "solucion": "10-detalle-solucion.html", "plan": "11-plan-accion.html", "personas": "12-personas-colectivos.html", "persona": "13-persona.html", "config": "14-configuracion.html", "analisis": "15-analisis-avanzado.html", "segmentacion": "16-segmentacion.html", "escucha": "17-escucha-continua.html", "ab": "18-pruebas-ab.html", "voces": "19-voces-ausentes.html", "alertas": "20-alertas.html", "crear": "04-crear-1-configuracion.html"};
function route(){const [n,a]=ROUTE.split('/');view.innerHTML=V[n](a);const k=MAP[n];document.querySelectorAll('.side a').forEach(e=>e.classList.toggle('on',e.dataset.nav===ACTIVE))}
route();
document.addEventListener('click',e=>{const t=e.target;
const cp=t.closest('[data-copy]');if(cp){navigator.clipboard&&navigator.clipboard.writeText(cp.dataset.copy).catch(()=>{});const s=cp.querySelector('span');if(s){const o=s.textContent;s.textContent='¡Copiado!';setTimeout(()=>s.textContent=o,1400)}return}
if(t.closest('.chk')){const ck=t.closest('.chk');ck.classList.toggle('on');return}
const pr=t.closest('[data-person]');if(pr){const [n,d,a]=pr.dataset.person.split('|');S.person={n,d,a};location.href=FILES.persona;return}
const tab=t.closest('.tab');if(tab){const g=tab.parentElement;g.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));tab.classList.add('on');const f=g.dataset.filter;if(f){const k=tab.dataset.t;document.querySelectorAll(f+' [data-cat]').forEach(r=>r.classList.toggle('hide',k!=='all'&&r.dataset.cat!==k))}}
const go=t.closest('[data-go]');if(go){location.href=FILES[go.dataset.go]||'02-inicio.html';return}
const sw=t.closest('.sw');if(sw){sw.classList.toggle('on');return}
const op=t.closest('.opt');if(op){const g=op.parentElement;if(g.hasAttribute('data-multi'))op.classList.toggle('on');else{g.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));op.classList.add('on')}return}
const sg=t.closest('[data-seg] button');if(sg){sg.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));sg.classList.add('on');return}
const sc=t.closest('[data-scale] span');if(sc){sc.parentElement.querySelectorAll('span').forEach(x=>x.classList.remove('on'));sc.classList.add('on');return}
const pw=t.closest('[data-pick] .alrow');if(pw){pw.parentElement.querySelectorAll('.alrow').forEach(x=>x.style.borderColor='transparent');pw.style.borderColor='var(--red)';return}
const rw=t.closest('.prow');if(rw){const g=rw.parentElement,pk=rw.classList.contains('pk');g.querySelectorAll('.prow').forEach(x=>{x.classList.remove('on');const r=x.querySelector('.rad');if(r)r.classList.remove('on');if(x.style.borderColor)x.style.borderColor=''});rw.classList.add('on');const r=rw.querySelector('.rad');if(r)r.classList.add('on');if(pk&&rw.querySelector('.rad.r')&&rw.closest('.card').textContent.includes('Prueba'))rw.style.borderColor='var(--red)';return}
const sv=t.closest('[data-save]');if(sv){const s=sv.querySelector('span');s.textContent='¡Guardado!';setTimeout(()=>s.textContent='Guardar preferencias',1400)}});
document.addEventListener('input',e=>{if(e.target.id==='desc')document.getElementById('cnt').textContent=e.target.value.length+'/500'});
</script>
</body>
</html>
